name: Publish iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Financial accuracy tests (must pass before publishing)
        run: npm test
      - name: Work out the web address
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "url=" >> "$GITHUB_OUTPUT"; else echo "url=/$REPO" >> "$GITHUB_OUTPUT"; fi
      - name: Build the app
        run: npx expo export --platform web && node scripts/make-pwa.mjs
        env:
          CI: 1
          EXPO_BASE_URL: ${{ steps.base.outputs.url }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
